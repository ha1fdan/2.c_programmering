{% extends 'base.html' %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
          <h2 class="fw-bold mb-4">Log in</h2>
          <form method="POST">
            <div class="mb-3">
              <label for="username" class="form-label">Username</label>
              <input type="text" class="form-control" id="username" name="username" placeholder="Username" value="{{ request.args.get('username', '') }}" required {% if not request.args.get('username') %}autofocus{% endif %}>
            </div>
            <div class="mb-3">
              <label for="password" class="form-label">Password</label>
              <input type="password" class="form-control" id="password" name="password" placeholder="Password" required {% if request.args.get('username') %}autofocus{% endif %}>
            </div>
            <button type="submit" class="btn btn-primary w-100">Log in</button>
          </form>
          <p class="text-center text-muted small mt-3 mb-0">
            Don't have an account? <a href="{{ url_for('register') }}">Register</a>
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
