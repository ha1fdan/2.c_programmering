{% extends 'base.html' %}
{% block title %}Artists{% endblock %}

{% block content %}
<div class="container">
  <h1 class="h2 mb-4">Artists</h1>

  <div class="list-group">
  {% for a in artists %}
    <a href="{{ url_for('list_artist_albums', artist_id=a['ArtistId']) }}" class="list-group-item list-group-item-action">{{ a['Name'] }}</a>
  {% endfor %}
  </div>
</div>
{% endblock %}
