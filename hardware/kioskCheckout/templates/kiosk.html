<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Self Checkout</title>
<style>
  :root {
    --ink: #10243a; --ink-2: #1c3a57; --floor: #e8ecf0; --paper: #fff; --line: #cdd5de;
    --muted: #5b6978; --sun: #ffc72c; --go: #08894a; --go-dark: #06703c; --stop: #c4271d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; font-family: "Segoe UI", "Helvetica Neue", Arial, system-ui, sans-serif; color: var(--ink);
         background: var(--floor); display: grid; grid-template-columns: 1fr 420px; grid-template-rows: auto 1fr;
         grid-template-areas: "bar bar" "stage receipt"; font-variant-numeric: tabular-nums; user-select: none; }
  button { font: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 4px solid var(--sun); outline-offset: 2px; }

  /* top bar */
  .bar { grid-area: bar; background: var(--ink); color: #fff; display: flex; align-items: center;
         justify-content: space-between; padding: 0 28px; height: 72px; border-bottom: 6px solid var(--sun); }
  .brand { font-size: 1.5rem; font-weight: 800; letter-spacing: -.01em; }
  .brand span { font-weight: 400; opacity: .7; margin-left: 12px; font-size: 1.05rem; }
  .cancel { background: transparent; color: #fff; border: 2px solid rgba(255,255,255,.45); border-radius: 10px;
            padding: 12px 22px; font-weight: 600; font-size: 1.05rem; }
  .cancel:active { background: rgba(255,255,255,.15); }

  /* stage */
  .stage { grid-area: stage; padding: 28px; display: flex; flex-direction: column; gap: 20px; min-height: 0; }
  .prompt { flex: 1; background: var(--paper); border-radius: 20px; border-left: 14px solid var(--ink-2);
            padding: 36px 40px; display: flex; flex-direction: column; justify-content: center; min-height: 0;
            box-shadow: 0 2px 0 var(--line); }
  .prompt.ok { border-left-color: var(--go); } .prompt.bad { border-left-color: var(--stop); }
  .prompt .icon { width: 96px; height: 96px; border-radius: 50%; background: var(--floor); display: grid;
                  place-items: center; margin-bottom: 28px; }
  .prompt.ok .icon { background: var(--go); } .prompt.bad .icon { background: var(--stop); }
  .icon svg { width: 52px; height: 52px; stroke: var(--ink); fill: none; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .prompt.ok .icon svg, .prompt.bad .icon svg { stroke: #fff; }
  .prompt .big { font-size: 3rem; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; max-width: 18ch; }
  .prompt .sub { color: var(--muted); margin-top: 14px; font-size: 1.5rem; }
  .choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; margin-top: 28px; }
  .choices button { background: var(--paper); color: var(--ink); border: 3px solid var(--ink); border-radius: 14px;
                    padding: 22px 18px; font-size: 1.35rem; font-weight: 700; text-align: left; min-height: 96px; }
  .choices button small { display: block; font-weight: 500; font-size: 1.05rem; color: var(--muted); margin-top: 6px; }
  .choices button.last { background: var(--ink); color: #fff; }
  .choices button.last small { color: rgba(255,255,255,.75); }
  .choices button:active { transform: scale(.98); }
  .ghost { align-self: flex-start; margin-top: 28px; background: transparent; color: var(--ink); border: 2px solid var(--line);
           border-radius: 12px; padding: 16px 24px; font-size: 1.15rem; font-weight: 600; }

  .readout { background: var(--ink); color: #fff; border-radius: 16px; padding: 18px 28px; display: flex;
             align-items: center; justify-content: space-between; gap: 20px; }
  .readout .label { opacity: .7; font-size: 1.05rem; }
  .readout .weight { font-size: 2.6rem; font-weight: 700; line-height: 1; }
  .readout .state { font-weight: 700; font-size: 1.15rem; padding: 10px 18px; border-radius: 999px; background: var(--ink-2); }
  .scale.ok .state { background: var(--go); } .scale.bad .state { background: var(--stop); }

  /* receipt */
  .receipt { grid-area: receipt; background: var(--paper); margin: 28px 28px 28px 0; display: flex; flex-direction: column;
             min-height: 0; border-radius: 6px 6px 0 0; box-shadow: 0 2px 0 var(--line);
             --zig: conic-gradient(from -45deg at bottom, #0000, #000 1deg 89deg, #0000 90deg) 50% / 22px 100%;
             -webkit-mask: var(--zig); mask: var(--zig); padding-bottom: 12px; }
  .receipt h2 { margin: 0; padding: 22px 26px 14px; font-size: 1.2rem; font-weight: 800; display: flex;
                justify-content: space-between; border-bottom: 2px dashed var(--line); }
  .receipt h2 span { color: var(--muted); font-weight: 600; }
  .cart { flex: 1; overflow-y: auto; padding: 6px 26px; }
  .row { display: flex; justify-content: space-between; align-items: baseline; padding: 14px 0;
         border-bottom: 1px solid #eef1f4; gap: 12px; font-size: 1.25rem; font-weight: 600; }
  .row small { display: block; font-weight: 400; color: var(--muted); font-size: 1rem; margin-top: 3px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; font-size: 1.15rem; }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 18px 26px 6px;
           border-top: 2px dashed var(--line); font-size: 1.3rem; font-weight: 700; }
  .total span:last-child { font-size: 2.4rem; font-weight: 800; letter-spacing: -.02em; }
  .pay { margin: 10px 26px 14px; background: var(--go); color: #fff; border: none; border-radius: 16px;
         padding: 26px; font-size: 1.7rem; font-weight: 800; box-shadow: 0 6px 0 var(--go-dark); }
  .pay:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 2px 0 var(--go-dark); }
  .pay:disabled { background: #d9dfe5; color: #8794a2; box-shadow: 0 6px 0 #bcc5ce; cursor: not-allowed; }

  .done { position: fixed; inset: 0; background: var(--go); color: #fff; display: none; align-items: center;
          justify-content: center; flex-direction: column; font-size: 4.5rem; font-weight: 800; gap: 16px; }
  .done small { font-size: 2rem; font-weight: 500; }
  .done.show { display: flex; }

  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto auto auto; grid-template-areas: "bar" "stage" "receipt"; height: auto; }
    .receipt { margin: 0 20px 20px; } .stage { padding: 20px; } .prompt .big { font-size: 2.2rem; }
  }
  @media (prefers-reduced-motion: no-preference) { .choices button, .pay { transition: transform .08s, box-shadow .08s; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Self checkout<span>Place items one at a time</span></div>
  <button class="cancel" id="clear">Cancel and start over</button>
</header>

<main class="stage">
  <div class="prompt" id="prompt"></div>
  <div class="readout scale" id="scale">
    <div><div class="label">Weight on scale</div><div class="weight" id="scaleDetail">-</div></div>
    <div class="state" id="scaleMsg">Waiting for scale</div>
  </div>
</main>

<aside class="receipt">
  <h2>Your basket <span id="count"></span></h2>
  <div class="cart" id="cart"></div>
  <div class="total"><span>Total</span><span id="total">0,00 kr</span></div>
  <button class="pay" id="pay" disabled>Pay</button>
</aside>

<div class="done" id="done"><div>Thank you!</div><small>Take your items</small></div>

<script>
const NOISE = 3;          // grams of drift we ignore
const SETTLE_POLLS = 3;   // consecutive polls within 1 g before a reading counts as settled

let items = [];
let cart = [];            // one entry per unit
let committed = null;     // scale weight (g) accounted for by the cart (plus tray/bag)
let history = [];         // recent raw readings
let lastPick = null;      // id of the last item added; offered first when weights are ambiguous

const $ = id => document.getElementById(id);
const kr = n => n.toFixed(2).replace('.', ',') + ' kr';
const g = n => n.toFixed(0) + ' g';

async function loadItems() { items = await (await fetch('/api/items')).json(); }

function settled() {
  if (history.length < SETTLE_POLLS) return null;
  const last = history.slice(-SETTLE_POLLS);
  if (Math.max(...last) - Math.min(...last) > 1) return null;
  return last.reduce((a, b) => a + b) / last.length;
}

function candidates(delta) {
  return items.filter(i => i.stock > cart.filter(c => c.id === i.id).length &&
                           Math.abs(delta - i.weight_g) <= i.tolerance_g)
              .sort((a, b) => (b.id === lastPick) - (a.id === lastPick) ||
                              Math.abs(delta - a.weight_g) - Math.abs(delta - b.weight_g));
}

function addItem(it, S) { cart.push(it); lastPick = it.id; committed = S; render(); }

const ICONS = {
  '':  '<path d="M12 4v12M6 11l6 6 6-6M5 21h14"/>',
  ok:  '<path d="M5 13l4 4L19 7"/>',
  bad: '<path d="M12 5v9M12 19v.5"/>',
  wait: '<circle cx="12" cy="12" r="8"/><path d="M12 7v5l3 2"/>',
};
let promptHtml = '';
function setPrompt(cls, big, sub, extra = '', icon = cls) {
  $('prompt').className = 'prompt ' + cls;
  const html = `<div class="icon"><svg viewBox="0 0 24 24">${ICONS[icon]}</svg></div>` +
               `<div class="big">${big}</div><div class="sub">${sub}</div>${extra}`;
  if (html !== promptHtml) { $('prompt').innerHTML = html; promptHtml = html; }  // keep buttons stable between polls so taps register
}

function render() {
  // basket
  const groups = new Map();
  cart.forEach(it => { const e = groups.get(it.id) || {it, n: 0}; e.n++; groups.set(it.id, e); });
  $('cart').innerHTML = cart.length ? [...groups.values()].map(({it, n}) =>
    `<div class="row"><span>${it.name}${n > 1 ? `<small>${n} × ${kr(it.price)}</small>` : ''}</span><span>${kr(it.price * n)}</span></div>`).join('')
    : '<div class="empty">Nothing scanned yet</div>';
  $('count').textContent = cart.length ? `${cart.length} ${cart.length === 1 ? 'item' : 'items'}` : '';
  $('total').textContent = kr(cart.reduce((s, i) => s + i.price, 0));

  const raw = history.length ? history[history.length - 1] : null;
  const S = settled();
  let clear = false;

  if (raw === null) {
    setPrompt('', 'Waiting for the scale', 'Checking the connection', '', 'wait');
    $('scaleMsg').textContent = 'No reading'; $('scale').className = 'readout scale';
  } else if (S === null) {
    setPrompt('', 'Weighing', 'Hold still for a moment', '', 'wait');
  } else {
    if (committed === null) committed = S;           // first settled reading = empty scale
    const delta = S - committed;
    if (Math.abs(delta) <= NOISE) {
      clear = true;
      const last = cart[cart.length - 1];
      setPrompt(last ? 'ok' : '', last ? `${last.name} added` : 'Place your first item on the scale',
                cart.length ? 'Place the next item, or press Pay' : 'One item at a time');
    } else if (delta < 0) {
      setPrompt('bad', 'Something was removed', `Put it back on the scale (${g(-delta)} missing)`);
    } else {
      const c = candidates(delta);
      if (c.length === 1) {
        addItem(c[0], S);
        return;
      } else if (c.length > 1) {
        setPrompt('', 'Which one did you add?', `${g(delta)} could be any of these`,
          `<div class="choices">${c.map(i => `<button data-id="${i.id}"${i.id === lastPick ? ' class="last"' : ''}>${i.name}<small>${kr(i.price)}</small></button>`).join('')}</div>`);
        $('prompt').querySelectorAll('button').forEach(b =>
          b.onclick = () => addItem(items.find(i => i.id == b.dataset.id), S));
      } else {
        setPrompt('bad', 'Item not recognised', `${g(delta)} was added. Take it off and try again.`,
          `<button class="ghost" id="tare">It's my bag or tray. Ignore it</button>`);
        $('tare').onclick = () => { committed = S; render(); };
      }
    }
    $('scale').className = 'readout scale ' + (clear ? 'ok' : 'bad');
    $('scaleMsg').textContent = clear ? 'Matches basket' : 'Checking';
  }
  if (raw !== null) $('scaleDetail').textContent = g(raw);
  $('pay').disabled = !(cart.length && clear);
  $('pay').textContent = cart.length ? `Pay ${kr(cart.reduce((s, i) => s + i.price, 0))}` : 'Pay';
}

async function poll() {
  try {
    const w = (await (await fetch('/api/weight')).json()).weight;
    if (w !== null) history = [...history, w].slice(-10);
  } catch {}
  render();
}

function reset() { cart = []; committed = settled(); render(); }

$('clear').onclick = reset;
$('pay').onclick = async () => {
  await fetch('/api/checkout', {method: 'POST', body: JSON.stringify({ids: cart.map(i => i.id)})});
  $('done').classList.add('show');
  setTimeout(() => { $('done').classList.remove('show'); cart = []; committed = null; history = []; loadItems(); render(); }, 3000);
};

loadItems().then(render);
setInterval(poll, 300);
</script>
</body>
</html>
