<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kiosk Admin</title>
<style>
  :root { --bg:#f4f5f7; --card:#fff; --text:#1b1f24; --muted:#6b7280; --line:#e2e5ea; --accent:#1f6feb; --ok:#1a7f37; --bad:#cf222e; --warn:#fff4d6; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14171c; --card:#1e2229; --text:#e8eaed; --muted:#9aa3af; --line:#2c323b; --accent:#4c8dff; --ok:#3fb950; --bad:#f85149; --warn:#3a3112; }
  }
  * { box-sizing: border-box; }
  body { margin:0; padding:24px; background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; flex-wrap:wrap; }
  h1 { margin:0; font-size:1.4rem; }
  a { color:var(--accent); }
  .scale { color:var(--muted); font-size:.95rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:820px; }
  th { text-align:left; font-size:.75rem; text-transform:uppercase; letter-spacing:.05em; color:var(--muted); padding:10px 8px; border-bottom:1px solid var(--line); }
  td { padding:6px 8px; border-bottom:1px solid var(--line); }
  tr:last-child td { border-bottom:0; }
  tr.low td { background:var(--warn); }
  tr.dirty td:first-child { box-shadow: inset 3px 0 var(--accent); }
  input { width:100%; padding:8px; font:inherit; color:inherit; background:var(--bg); border:1px solid var(--line); border-radius:8px; }
  input.num { width:90px; text-align:right; }
  .weightcell { display:flex; gap:4px; align-items:center; }
  button { font:inherit; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:var(--text); cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
  button.danger { color:var(--bad); }
  button:disabled { opacity:.4; cursor:default; }
  .actions { display:flex; gap:6px; white-space:nowrap; }
  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--text); color:var(--bg); padding:10px 16px; border-radius:10px; display:none; }
  #toast.bad { background:var(--bad); color:#fff; }
  .hint { color:var(--muted); font-size:.85rem; margin-top:10px; }
</style>
</head>
<body>
<header>
  <h1>Inventory</h1>
  <div><span class="scale" id="scale">Scale: …</span> · <a href="/">Back to kiosk</a></div>
</header>

<div class="card">
<table>
  <thead><tr>
    <th>Name</th><th>Category</th><th>Price (kr)</th><th>Weight (g)</th><th>Tolerance (g)</th><th>Stock</th><th></th>
  </tr></thead>
  <tbody id="rows"></tbody>
  <tfoot><tr id="newrow"></tr></tfoot>
</table>
</div>
<p class="hint">Rows with stock of 5 or less are highlighted. Press <b>⚖</b> next to a weight to fill it from whatever is on the scale right now.</p>
<div id="toast"></div>

<script>
const $ = id => document.getElementById(id);
const LOW_STOCK = 5;
let scaleWeight = null;

function toast(msg, bad) {
  const t = $('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block';
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.style.display = 'none', 2500);
}

async function api(method, url, body) {
  const res = await fetch(url, {method, body: body && JSON.stringify(body)});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

const esc = s => String(s ?? '').replace(/"/g, '&quot;');

function rowHtml(it) {
  return `<td><input data-f="name" value="${esc(it.name)}"></td>
    <td><input data-f="category" value="${esc(it.category)}" list="cats"></td>
    <td><input class="num" data-f="price" type="number" step="0.01" min="0" value="${it.price ?? ''}"></td>
    <td><div class="weightcell"><input class="num" data-f="weight_g" type="number" step="0.1" min="0" value="${it.weight_g ?? ''}">
        <button type="button" data-scale title="Use current scale reading">⚖</button></div></td>
    <td><input class="num" data-f="tolerance_g" type="number" step="0.1" min="0" value="${it.tolerance_g ?? 5}"></td>
    <td><input class="num" data-f="stock" type="number" step="1" min="0" value="${it.stock ?? 0}"></td>`;
}

function read(tr) {
  const o = {};
  tr.querySelectorAll('input[data-f]').forEach(i => o[i.dataset.f] = i.value);
  return o;
}

function wire(tr) {
  tr.querySelectorAll('input').forEach(i => i.oninput = () => tr.classList.add('dirty'));
  tr.querySelector('[data-scale]').onclick = () => {
    if (scaleWeight === null) return toast('No scale reading available', true);
    const w = tr.querySelector('[data-f=weight_g]'); w.value = scaleWeight.toFixed(1); tr.classList.add('dirty');
  };
}

async function load() {
  const items = await api('GET', '/api/items');
  $('rows').innerHTML = '';
  const cats = [...new Set(items.map(i => i.category).filter(Boolean))];
  if (!$('cats')) document.body.insertAdjacentHTML('beforeend', '<datalist id="cats"></datalist>');
  $('cats').innerHTML = cats.map(c => `<option value="${esc(c)}">`).join('');

  items.forEach(it => {
    const tr = document.createElement('tr');
    if (it.stock <= LOW_STOCK) tr.classList.add('low');
    tr.innerHTML = rowHtml(it) + `<td class="actions"><button class="primary">Save</button><button class="danger">Delete</button></td>`;
    wire(tr);
    const [save, del] = tr.querySelectorAll('.actions button');
    save.onclick = async () => {
      try { await api('PUT', `/api/admin/items/${it.id}`, read(tr)); toast('Saved'); load(); }
      catch (e) { toast(e.message, true); }
    };
    del.onclick = async () => {
      if (!confirm(`Delete "${it.name}"?`)) return;
      try { await api('DELETE', `/api/admin/items/${it.id}`); toast('Deleted'); load(); }
      catch (e) { toast(e.message, true); }
    };
    $('rows').appendChild(tr);
  });
  if (!items.length) $('rows').innerHTML = '<tr><td colspan="7" style="color:var(--muted);padding:20px">No items yet. Add the first one below.</td></tr>';

  const nr = $('newrow');
  nr.innerHTML = rowHtml({tolerance_g: 5, stock: 0}) + `<td><button class="primary">Add item</button></td>`;
  wire(nr);
  nr.querySelector('.primary').onclick = async () => {
    try { await api('POST', '/api/admin/items', read(nr)); toast('Added'); load(); }
    catch (e) { toast(e.message, true); }
  };
}

async function pollScale() {
  try { scaleWeight = (await api('GET', '/api/weight')).weight; } catch { scaleWeight = null; }
  $('scale').textContent = scaleWeight === null ? 'Scale: no reading' : `Scale: ${scaleWeight.toFixed(1)} g`;
}

load();
pollScale(); setInterval(pollScale, 500);
</script>
</body>
</html>
